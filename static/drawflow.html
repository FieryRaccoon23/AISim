<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Drawflow Graph UI</title>
  <link rel="stylesheet" href="/drawflow-assets/dist/drawflow.min.css">
  <script src="/drawflow-assets/dist/drawflow.min.js"></script>
  <style>
    :root {
      --bg-app: #ffffff;
      --bg-sidebar: #f4f4f6;
      --bg-canvas: #ffffff;
      --accent: #4f8cff;
      --text: #000000;
      --node-bg: #f7f7f9;
      --node-border: #ccccd6;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg-app);
      font-family: sans-serif;
      color: var(--text);
      overflow: hidden;
    }

    #app { display: flex; height: 100%; }

    /* ---------------- Left panel ---------------- */
    #sidebar {
      width: 220px;
      flex-shrink: 0;
      background: var(--bg-sidebar);
      border-right: 1px solid #ddd;
      padding: 12px;
      box-sizing: border-box;
      overflow-y: auto;
    }
    #sidebar h3 {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin: 16px 0 8px;
    }
    #sidebar h3:first-child { margin-top: 0; }
    .drag-node {
      display: block;
      padding: 8px 10px;
      margin-bottom: 6px;
      background: var(--node-bg);
      color: var(--text);
      border: 1px solid #333;
      border-radius: 4px;
      cursor: grab;
      font-size: 13px;
      user-select: none;
    }
    .drag-node:hover { border-color: var(--accent); }

    /* ---------------- Canvas area ---------------- */
    #canvas-area { position: relative; flex: 1; }
    #toolbar { position: absolute; top: 10px; left: 10px; z-index: 10; }
    #toolbar button {
      padding: 8px 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #toolbar button:hover { filter: brightness(1.1); }
    #result { margin-left: 12px; font-size: 13px; color: #9be89b; }

    #drawflow {
      width: 100%;
      height: 100%;
      background: var(--bg-canvas);
      background-size: 25px 25px;
      background-image:
        linear-gradient(to right, #e6e6ec 1px, transparent 1px),
        linear-gradient(to bottom, #e6e6ec 1px, transparent 1px);
    }

    /* ---- Node theming (Drawflow-specific classes) ---- */
    .drawflow .drawflow-node {
      background: var(--node-bg);
      border: 1px solid var(--node-border);
      color: var(--text);
      border-radius: 6px;
      padding: 10px;
    }
    .drawflow .drawflow-node.selected {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent);
    }
    .drawflow .connection .main-path {
      stroke: var(--accent);
      stroke-width: 3px;
    }
    .drawflow .drawflow-node .input,
    .drawflow .drawflow-node .output {
      background: var(--accent);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="sidebar">
      <h3>Nodes</h3>
      <div class="drag-node" draggable="true" data-node="add">Add</div>
      <div class="drag-node" draggable="true" data-node="constant">Constant</div>
      <div class="drag-node" draggable="true" data-node="print">Print</div>
    </div>

    <div id="canvas-area">
      <div id="toolbar">
        <button onclick="runGraph()">Run Graph</button>
        <span id="result"></span>
      </div>
      <div id="drawflow"></div>
    </div>
  </div>

  <script>
    /* =========================================================
       Set up the editor
       ========================================================= */
    const container = document.getElementById("drawflow");
    const editor = new Drawflow(container);
    editor.reroute = true;
    editor.start();

    /* =========================================================
       Custom node templates.
       Each node is just an HTML string; df-* attributes bind
       inputs to the node's data object automatically.
       ========================================================= */
    const NODE_TEMPLATES = {
      add: {
        name: "add",
        inputs: 2,
        outputs: 1,
        html: `<div><b>Add</b></div>`,
        data: {},
      },
      constant: {
        name: "constant",
        inputs: 0,
        outputs: 1,
        html: `<div><b>Constant</b><br><input type="number" df-value value="1"></div>`,
        data: { value: 1 },
      },
      print: {
        name: "print",
        inputs: 1,
        outputs: 0,
        html: `<div><b>Print</b></div>`,
        data: {},
      },
    };

    /* =========================================================
       Sidebar drag-and-drop -> create node on drop
       ========================================================= */
    let draggedType = null;

    document.querySelectorAll(".drag-node").forEach(el => {
      el.addEventListener("dragstart", ev => {
        draggedType = ev.target.dataset.node;
      });
    });

    container.addEventListener("dragover", ev => ev.preventDefault());

    container.addEventListener("drop", ev => {
      ev.preventDefault();
      if (!draggedType) return;

      const tpl = NODE_TEMPLATES[draggedType];
      const rect = container.getBoundingClientRect();
      // account for editor pan/zoom so the node lands under the cursor
      const x = (ev.clientX - rect.left - editor.canvas_x) / editor.zoom;
      const y = (ev.clientY - rect.top - editor.canvas_y) / editor.zoom;

      editor.addNode(
        tpl.name,
        tpl.inputs,
        tpl.outputs,
        x,
        y,
        tpl.name,          // css class applied to the node
        { ...tpl.data },
        tpl.html
      );
      draggedType = null;
    });

    /* =========================================================
       Send the current graph to the FastAPI backend
       ========================================================= */
    async function runGraph() {
      const resultEl = document.getElementById("result");
      resultEl.textContent = "Running...";
      try {
        const response = await fetch("/api/graph-drawflow", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(editor.export()),
        });
        const data = await response.json();
        resultEl.textContent = `OK: ${data.node_count} nodes (see server console)`;
      } catch (err) {
        resultEl.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
